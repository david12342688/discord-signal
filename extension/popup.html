<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font: 13px/1.45 system-ui, sans-serif;
      width: 340px;
      margin: 0;
      padding: 12px;
      background: #2b2d31;
      color: #dbdee1;
    }
    h1 { font-size: 14px; margin: 0 0 10px; color: #fff; }
    fieldset { border: 1px solid #3f4147; border-radius: 6px; margin: 0 0 10px; padding: 8px 10px; }
    legend { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #949ba4; padding: 0 4px; }
    label { display: block; margin: 6px 0 2px; color: #b5bac1; }
    .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    .row label { margin: 0; }
    input[type="text"], input[type="password"], input[type="number"], textarea {
      width: 100%; box-sizing: border-box; background: #1e1f22; color: #dbdee1;
      border: 1px solid #3f4147; border-radius: 4px; padding: 5px 7px; font: inherit;
    }
    textarea { height: 48px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
    button {
      background: #5865f2; color: #fff; border: 0; border-radius: 4px;
      padding: 6px 12px; font: inherit; cursor: pointer;
    }
    button.secondary { background: #4e5058; }
    button:disabled { opacity: .5; cursor: default; }
    .buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    #status div { margin: 3px 0; }
    .ok { color: #3ba55d; }
    .warn { color: #faa61a; }
    .err { color: #ed4245; font-weight: 600; }
    .muted { color: #949ba4; }
    #saveMsg { margin-left: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Discord Signal Capture</h1>

  <fieldset id="status">
    <legend>Status</legend>
    <div id="stTab" class="muted">checking tab…</div>
    <div id="stSelectors"></div>
    <div id="stCaptured"></div>
    <div id="stBuffered"></div>
    <div id="stPost"></div>
    <div id="stError"></div>
  </fieldset>

  <fieldset>
    <legend>Capture</legend>
    <div class="row">
      <input type="checkbox" id="enabled">
      <label for="enabled">Capture enabled</label>
    </div>
    <div class="row">
      <input type="checkbox" id="consoleOnly">
      <label for="consoleOnly">Console-only mode (don't POST anywhere)</label>
    </div>
    <label for="allowlist">Channel allowlist — one channel ID per line (empty = all)</label>
    <textarea id="allowlist" placeholder="1234567890123456789"></textarea>
  </fieldset>

  <fieldset>
    <legend>Processor</legend>
    <label for="endpoint">Ingest endpoint URL</label>
    <input type="text" id="endpoint" placeholder="https://your-vps.example.com/ingest">
    <label for="secret">Shared secret</label>
    <input type="password" id="secret" placeholder="X-Capture-Auth header value">
  </fieldset>

  <div class="buttons">
    <button id="save">Save</button>
    <button id="postNow" class="secondary">Post now</button>
    <button id="clearBuf" class="secondary">Clear buffer</button>
    <span id="saveMsg"></span>
  </div>

  <fieldset style="margin-top:10px">
    <legend>One-shot backfill</legend>
    <div class="row">
      <label for="backfillHours">Hours</label>
      <input type="number" id="backfillHours" value="24" min="1" max="72" style="width:64px">
      <button id="backfill" class="secondary">Start backfill</button>
    </div>
    <div class="muted">Slow, human-paced scroll-back in the open channel. Keep the tab visible while it runs.</div>
  </fieldset>

  <script src="popup.js"></script>
</body>
</html>
